<link rel="stylesheet" href="./assets/css/main.css" />

<article class="orders-page">
  <header class="orders-header">
    <div>
      <p class="hero-tag">Historial comercial</p>
      <h1 class="orders-title">Mis Pedidos</h1>
    </div>
    <p class="orders-subtitle">Revisa el estado de tus compras y el detalle de cada entrega.</p>
  </header>

  <section class="orders-content" aria-label="Listado de órdenes de compra">
    <div id="orders-container" class="orders-list-wrapper">
      <table class="orders-table">
        <thead>
          <tr>
            <th scope="col">ID Orden</th>
            <th scope="col">Fecha</th>
            <th scope="col">Productos</th>
            <th scope="col">Total</th>
            <th scope="col">Estado</th>
          </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>

    <section class="orders-detail-card">
      <div class="card-title-row">
        <div>
          <p class="hero-tag">Detalle</p>
          <h2>Resumen de tu pedido</h2>
        </div>
      </div>
      <div id="orders-detail-panel" class="orders-detail-panel">
        <p>Selecciona una orden para ver su resumen, dirección y método de pago.</p>
      </div>
    </section>
  </section>
</article>

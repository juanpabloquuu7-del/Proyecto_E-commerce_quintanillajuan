<link rel="stylesheet" href="./assets/css/main.css" />

<article class="product-detail-page">
  <div class="detail-container">
    
    <section class="detail-gallery" aria-label="Galería de imágenes del producto">
      <figure class="main-image-wrapper">
        <img id="detail-main-img" src="./assets/js/pages/imgs/outfit_1_eclat_noir.png" alt="Cargando producto de alta costura..." class="main-product-img" />
      </figure>
    </section>

    <section class="detail-info" aria-label="Información y opciones de compra">
      <header class="detail-header">
        <span id="detail-category" class="product-meta-category">Categoría</span>
        <h1 id="detail-name" class="product-title">Nombre del Producto</h1>
        <div id="detail-price" class="product-price" aria-live="polite">$0.00</div>
      </header>
      
      <div class="product-divider" role="presentation"></div>
      
      <p id="detail-description" class="product-description">
        Cargando las especificaciones, texturas y descripción exclusiva de la pieza...
      </p>

      <section class="product-options" aria-label="Configuración de la prenda">
        <h2 class="option-label">Seleccionar Talla</h2>
        <div class="size-selector" role="radiogroup" aria-label="Tallas disponibles">
          <button type="button" role="radio" aria-checked="false" class="size-btn">S</button>
          <button type="button" role="radio" aria-checked="true" class="size-btn active">M</button>
          <button type="button" role="radio" aria-checked="false" class="size-btn">L</button>
          <button type="button" role="radio" aria-checked="false" class="size-btn">XL</button>
        </div>
      </section>

      <footer class="detail-actions">
        <button id="add-to-cart-btn" class="btn-add-cart" aria-label="Añadir esta pieza exclusiva al carrito de compras">
          Añadir al Carrito
        </button>
        <button type="button" data-route="/catalog" class="btn-back-link">
          Volver al catálogo
        </button>
      </footer>
    </section>

  </div>
</article>

<section class="admin-page">
  <div class="admin-login-panel admin-card">
    <p class="hero-tag">Acceso seguro</p>
    <h1>Panel de control LUMIÈRE</h1>
    <p class="admin-lead">
      Ingresa con las credenciales del equipo para administrar catálogo, categorías y pedidos.
    </p>

    <form id="admin-login-form" class="admin-form">
      <label class="field-row">
        <span>Correo electrónico</span>
        <input id="admin-email" type="email" placeholder="admin@mail.com" required />
      </label>

      <label class="field-row">
        <span>Contraseña</span>
        <input id="admin-password" type="password" placeholder="123456" required />
      </label>

      <button type="submit" class="btn-primary">Entrar al dashboard</button>
    </form>

    <div class="admin-note">
      <strong>Credenciales de demostración:</strong>
      <span>admin@mail.com / 123456</span>
    </div>
  </div>
</section>
